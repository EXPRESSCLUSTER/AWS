name: RunECXInstall
description: 'This document will install ExpressCluster 5.2 for Windows (by running an installation script) and install Windows updates. It will then validate the changes before an AMI is created. Then after the AMI creation, it will test all the changes before running a final file cleanup.'
schemaVersion: 1.0
parameters:
  - ECXInstall:
      type: string
      default: 'install-ecx.ps1'
      description: ExpressCluster installation script
  - ECXTestScript:
      type: string
      default: 'testECXConfig.ps1'
      description: Confirm installation script
  - BaseLicenseKey:
      type: string
      default: 'X5x_Base.key'
      description: ECX Base license key
  - AlrtLicenseKey:
      type: string
      default: 'X5x_ALRT.key'
      description: ECX Alert license key
  - ReplLicenseKey:
      type: string
      default: 'X5x_REPL.key'
      description: ECX Replication license key
phases:
  - name: build
    steps:
      - name: DownloadECXScript
        action: S3Download
        timeoutSeconds: 60
        onFailure: Abort
        maxAttempts: 3
        inputs:
          - source: 's3://ecxbucket/{{ECXInstall}}'
            destination: 'C:\{{ECXInstall}}'
          - source: 's3://ecxbucket/{{AlrtLicenseKey}}'
            destination: 'C:\{{AlrtLicenseKey}}'
          - source: 's3://ecxbucket/{{BaseLicenseKey}}'
            destination: 'C:\{{BaseLicenseKey}}'
          - source: 's3://ecxbucket/{{ReplLicenseKey}}'
            destination: 'C:\{{ReplLicenseKey}}'

      - name: RunConfigScript
        action: ExecutePowerShell
        timeoutSeconds: 120
        onFailure: Abort
        maxAttempts: 3
        inputs:
          file: '{{build.DownloadECXScript.inputs[0].destination}}'

      - name: Cleanup
        action: DeleteFile
        onFailure: Abort
        maxAttempts: 3
        inputs:
          - path: '{{build.DownloadECXScript.inputs[0].destination}}'
          - path: '{{build.DownloadECXScript.inputs[1].destination}}'
          - path: '{{build.DownloadECXScript.inputs[2].destination}}'
          - path: '{{build.DownloadECXScript.inputs[3].destination}}'

      - name: RebootAfterConfigApplied
        action: Reboot
        inputs:
          delaySeconds: 60

      - name: InstallWindowsUpdates
        action: UpdateOS

  - name: validate
    steps:
      - name: DownloadTestConfigScript
        action: S3Download
        timeoutSeconds: 60
        onFailure: Abort
        maxAttempts: 3
        inputs:
          - source: 's3://ecxbucket/{{ECXTestScript}}'
            destination: 'C:\{{ECXTestScript}}'

      - name: ValidateConfigScript
        action: ExecutePowerShell
        timeoutSeconds: 120
        onFailure: Abort
        maxAttempts: 3
        inputs:
          file: '{{validate.DownloadTestConfigScript.inputs[0].destination}}'

      - name: Cleanup
        action: DeleteFile
        onFailure: Abort
        maxAttempts: 3
        inputs:
          - path: '{{validate.DownloadTestConfigScript.inputs[0].destination}}'
